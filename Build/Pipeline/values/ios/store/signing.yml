      SigningCertificate: "iPhone Distribution: Tactile Games ApS (4ZRE6C9AS9)"
    - ProvisioningProfile: 'appstore_adhoc.mobileprovision'
      SigningCertificate: "iPhone Distribution: Tactile Games ApS (4ZRE6C9AS9)"
      Postfix: adhoc
