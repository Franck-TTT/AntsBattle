# Values are defined in .pipeline/values
values:
  - product/inhouse
  - game/game
  - android/gradle

# Plugins are defined in .pipeline/nuget.yml
plugins:
  - name: BuildPlugins.ProjectVersioning
  - name: BuildPlugins.AppSigning
  - name: BuildPlugins.Android

steps:
  # VersioningStep takes VERSION_CODE from BRANCH_REVISION, which on Git is the commit SHA.
  # Scoped to this step, the server build ID takes its place.
  - name: Versioning
    values:
      - BRANCH_REVISION: "<BUILD_ID>"
    run:
      stepId: VersioningStep

  # Every game test (`gameengine test --tier t0,t1`), then `gameengine check`: a failure stops the
  # build here, before it builds or signs anything.
  - name: Run Tests
    run:
      script: Build/Pipeline/scripts/run_tests

  # The keystores the script and Bundletool sign with, at <ROOT_PATH>/AppSigning.
  - name: Clone AppSigning
    run:
      stepId: CloneAppSigningStep

  # The engine build in place of the Unity build and Gradle: leaves the signed app-bundle.aab.
  - name: Build Game
    run:
      script: Build/Pipeline/scripts/build_game

  # Sets the universal APK as the main artifact. No store artifact: testers sideload the APK, and
  # nothing marks the in-house AAB as the file to upload to a store.
  - name: Extract APK from AAB
    run:
      stepId: BundletoolStep
